# ==============================================================================
# Development Docker Compose Overrides
# Automatically merged by Docker Compose in development environments
# Provides hot-reloading, host port exposure, and local debugging volumes
# ==============================================================================

services:
  db:
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  backend:
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      DEBUG: "1"
      ENVIRONMENT: development
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    volumes:
      - ./backend:/src
      - static_volume:/src/static
      - media_volume:/src/media
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build:
      context: ./frontend
      target: dev
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    environment:
      NODE_ENV: development
    command: ["npm", "run", "dev", "--", "-H", "0.0.0.0", "-p", "3000"]
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "127.0.0.1:3000:3000"
