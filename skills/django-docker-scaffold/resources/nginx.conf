# ==============================================================================
# Nginx Reverse Proxy Configuration
# Routes external traffic to Django backend, Next.js frontend, and static volumes
# ==============================================================================

upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:3000;
}

# Map for WebSocket connection upgrade
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;

    # Do not advertise the exact nginx version in the Server header or error pages.
    server_tokens off;

    # 100M let any unauthenticated client make nginx buffer 100 MB per concurrent request
    # (disk/CPU exhaustion). Raise deliberately, per upload route, only where required.
    client_max_body_size 25M;

    # Baseline hardening. Locations that declare their own add_header do not inherit these,
    # so the static and media blocks below repeat them.
    add_header X-Content-Type-Options "nosniff" always;
    # Must match Django's X_FRAME_OPTIONS; conflicting values on one response are invalid.
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Proxy headers
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # 1. Django Static Assets
    location /static/ {
        alias /var/www/static/;
        access_log off;
        expires 30d;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # 2. Django Media Uploads
    location /media/ {
        alias /var/www/media/;
        access_log off;
        expires 7d;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=604800";
        # User uploads are untrusted: an uploaded .html or .svg opened directly would
        # otherwise run script on the application origin and read the CSRF cookie.
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    }

    # 3. Django Admin Interface
    location /admin/ {
        proxy_pass http://backend;
        proxy_redirect off;
    }

    # 4. Django REST Framework APIs & Healthcheck
    location /api/ {
        proxy_pass http://backend;
        proxy_redirect off;
    }

    # 5. Next.js Frontend Application (Default Route)
    location / {
        proxy_pass http://frontend;
        proxy_redirect off;
    }
}
